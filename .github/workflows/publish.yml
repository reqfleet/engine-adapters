name: Release and publish adapters
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      k6_release_created: ${{ steps.release.outputs['k6--release_created'] }}
      k6_version: ${{ steps.release.outputs['k6--version'] }}
      k6_sha: ${{ steps.release.outputs['k6--sha'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  conformance:
    needs: release-please
    if: needs.release-please.outputs.k6_release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.k6_sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make -C k6 test
  publish:
    needs: [release-please, conformance]
    if: needs.release-please.outputs.k6_release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.k6_sha }}
      - name: Publish k6 adapter
        uses: ./.github/actions/publish-k6
        id: image
        with:
          version: v${{ needs.release-please.outputs.k6_version }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Record immutable deployment reference
        run: echo 'ghcr.io/reqfleet/engine-adapters/k6@${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
