name: Publish versioned k6 adapter
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - run: make test
  publish:
    needs: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: k6/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/reqfleet/engine-adapters/k6:${{ github.ref_name }}
      - name: Record immutable deployment reference
        run: echo 'ghcr.io/reqfleet/engine-adapters/k6@${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
