name: Publish versioned k6 adapter
on:
  push:
    tags: ['k6/v[0-9]*']
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
  publish:
    needs: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract k6 release version
        id: release
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#k6/}" >> "$GITHUB_OUTPUT"
      - name: Publish k6 adapter
        uses: ./.github/actions/publish-k6
        id: image
        with:
          version: ${{ steps.release.outputs.version }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Record immutable deployment reference
        run: echo 'ghcr.io/reqfleet/engine-adapters/k6@${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
