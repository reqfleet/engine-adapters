name: Publish k6 adapter
description: Publish the versioned multi-platform k6 runtime image to GHCR.
inputs:
  version:
    description: Adapter image version without the k6/ tag prefix, such as v0.1.0.
    required: true
  registry-token:
    description: GitHub token with packages write permission.
    required: true
outputs:
  digest:
    description: Immutable digest of the published multi-platform image.
    value: ${{ steps.image.outputs.digest }}
runs:
  using: composite
  steps:
    # The target-platform base stage runs apt-get; arm64 needs emulation on amd64.
    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.registry-token }}
    - uses: docker/build-push-action@v6
      id: image
      with:
        context: .
        file: k6/Dockerfile
        target: runtime
        platforms: linux/amd64,linux/arm64
        push: true
        provenance: true
        sbom: true
        tags: ghcr.io/reqfleet/engine-adapters/k6:${{ inputs.version }}
